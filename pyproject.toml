[project]
name = "dyad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "UdaraN98", email = "udara.unb98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.35.0",
    "boto3>=1.43.111",
    "pydantic>=2.14.0",
]

[project.scripts]
dyad = "dyad:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
agents = [
    "langchain-aws>=1.8.1",
    "langgraph>=1.2.14",
]
dev = [
    "boto3>=1.43.111",
    "boto3-stubs[essential]>=1.43.111",
    "import-linter>=2.15",
    "moto[dynamodb,kms,s3,ssm]>=5.2.3",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
infra = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]
ml = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]
